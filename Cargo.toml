[package]
name = "blibs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Search the libraries of Berlin and Brandenburg from the command line."
license = "MIT"
repository = "https://github.com/EiSiMo/blibs"
keywords = ["library", "catalogue", "kobv", "voebb", "cli"]
categories = ["command-line-utilities"]

# The parser fixtures are 1.4 MB of saved HTML, MARCXML and JSON. They are the evidence
# behind every parser test and they stay in the repository — but `cargo install blibs`
# would download them to build a binary that never reads one: every `include_str!` that
# touches them sits inside a `#[cfg(test)]` module. Excluding them keeps the published
# crate to the code it actually compiles; `cargo test` runs from a clone, not a tarball.
exclude = ["tests/fixtures/**", "docs/**"]

# The screenshots under `docs/` are the same case: crates.io renders the README by rewriting
# relative image paths onto the repository, so it never reads the files from the tarball.

# The library target exists because `main.rs` is a thin shell over `cli::run` and the
# integration tests in `tests/` reach the modules through it. It is **not** a public API:
# see the stability note at the top of `src/lib.rs`.
[lib]
name = "blibs"
path = "src/lib.rs"

[[bin]]
name = "blibs"
path = "src/main.rs"

[dependencies]
# Argument parsing. `derive` keeps the CLI contract next to the types it fills;
# `wrap_help` reflows the long help that `blibs` prints when called without arguments.
# `suggestions` turns a typo'd subcommand into a pointer instead of a bare "unrecognized",
# which is what exit code 2 promises; it is a default feature, so it is not listed here and
# `default-features = false` would silently drop it.
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }

# HTTP client. Blocking and thread-based on purpose: a query fans out to at most a few
# dozen requests against two hosts, which a thread pool serves without an async runtime;
# `cookies` is required because voebb.de is session-bound, rustls arrives via the defaults.
ureq = { version = "3.4.1", features = ["cookies"] }

# The JSON output schema is derived from the domain types so human and agent output cannot
# drift apart; `derive` is what makes that a one-liner per type.
serde = { version = "1.0.229", features = ["derive"] }

# `preserve_order` is not cosmetic: the availability response is matched positionally
# against the key order of `isilAvailability`, because the HTML fragment it describes
# carries no ISIL of its own. With the keys reordered, every copy lands at the wrong
# library.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# One error enum with structured fields and a Display that says what failed.
thiserror = "2.0.20"

# MARCXML/SRU parsing. Read-only, zero-copy, no DTD/entity expansion — the whole SRU
# envelope is walked once and never mutated.
roxmltree = "0.21.1"

# HTML: the shelf table inside the availability JSON and everything voebb.de returns.
# A real parser is mandatory here — a failed selector must be nameable in an error.
scraper = "0.27.0"

# Cache keys: sha256 over method + host + path + sorted query.
sha2 = "0.11.0"

# Terminal column widths must be computed on CJK and combining text, not on `str::len`.
unicode-width = "0.2.2"

# Terminal width for the table renderer; falls back to a fixed width when not a TTY.
terminal_size = "0.4.4"

# Colour as data: `anstyle` describes a style without deciding whether it is emitted.
# Whether it *is* emitted is decided in `render::style` from `IsTerminal`, `NO_COLOR` and
# `TERM` — three checks, no second crate, and the layout is computed on the uncoloured
# text either way.
anstyle = "1.0.14"

[dev-dependencies]
# Black-box CLI tests: exit codes, stdout/stderr separation, help text.
assert_cmd = "2.2.2"

# Readable assertions on that output.
predicates = "3.1.4"

# Throwaway directories for the on-disk response cache tests.
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Module paths are the namespace: `model::record::Record` reads worse than `RecordId` in
# `model::id`, and the re-exports in `model::mod` are what callers actually use.
module_name_repetitions = "allow"
# Almost every accessor in `model` is a candidate; the annotation would outnumber the code.
must_use_candidate = "allow"
# Every fallible function in this crate returns the single `Error` enum, whose variants
# carry their own remediation text. Failure modes are documented in prose in
# the doc comment instead of in a boilerplate `# Errors` section.
missing_errors_doc = "allow"
# Same reasoning: panics are documented where they exist, and no path reachable from user
# or network input is allowed to panic at all.
missing_panics_doc = "allow"
